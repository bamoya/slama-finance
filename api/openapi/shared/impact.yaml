components:
  schemas:
    DeletionRecord:
      type: object
      additionalProperties: false
      required: [id, expectedVersion]
      properties:
        id: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
    EntityDeletionImpact:
      type: object
      additionalProperties: false
      required: [token, expiresAt, groups, requiredPermissions, blockers, media]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        groups:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [resource, operation, records]
            properties:
              resource: { type: string }
              operation: { type: string, enum: [delete, detach] }
              records:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, name]
                  properties:
                    id: { type: string }
                    name: { type: [string, 'null'] }
        requiredPermissions: { type: array, items: { type: string } }
        blockers: { type: array, items: { type: string } }
        media: { type: integer, minimum: 0 }
        files: { type: integer, minimum: 0 }
        retainedFiles: { type: integer, minimum: 0 }
        jobs: { type: integer, minimum: 0 }
        emails: { type: integer, minimum: 0 }
