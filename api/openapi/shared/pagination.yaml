paths: {}
components:
  schemas:
    PageMetadata:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
        - page
        - pageSize
        - total
      additionalProperties: false
    VersionedUpdate:
      type: object
      properties:
        expectedVersion:
          type: integer
          minimum: 1
      required:
        - expectedVersion
      additionalProperties: false
