paths:
  /v1/clients/deletion/preview:
    post:
      operationId: previewClientDeletion
      tags: [clients]
      x-permissions: [clients.delete]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientDeletionSelection' }
      responses:
        '200':
          description: Current client deletion and document preservation/cascade impact.
          content:
            application/json:
              schema: { $ref: '../../shared/impact.yaml#/components/schemas/EntityDeletionImpact' }
        default:
          description: Whole selection blocked.
          content:
            application/json:
              schema: { $ref: '../../shared/errors.yaml#/components/schemas/Error' }
  /v1/clients/deletion:
    post:
      operationId: confirmClientDeletion
      tags: [clients]
      x-permissions: [clients.delete]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmClientDeletion' }
      responses:
        '204': { description: Entire selection removed atomically. Files are cleaned after commit. }
        default:
          description: Nothing changed; review a fresh preview.
          content:
            application/json:
              schema: { $ref: '../../shared/errors.yaml#/components/schemas/Error' }
components:
  schemas:
    ClientDeletionSelection:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        cascadeDocuments: { type: boolean, default: false }
        records:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '../../shared/impact.yaml#/components/schemas/DeletionRecord' }
    ConfirmClientDeletion:
      type: object
      additionalProperties: false
      required: [records, token]
      properties:
        records: { $ref: '#/components/schemas/ClientDeletionSelection/properties/records' }
        cascadeDocuments: { type: boolean, default: false }
        token: { type: string, minLength: 1, maxLength: 256 }
