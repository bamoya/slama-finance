paths:
  /v1/invoices/{id}/send:
    post:
      operationId: sendInvoice
      tags: [sales]
      description: Requires invoices.read and invoices.update. Durable consent-aware preparation; provider acceptance later sets eligible send metadata. Same requestId and canonical input returns existing work.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendDocumentInput' }
      responses:
        '202':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreparation' }
        '400':
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '../../shared/errors.yaml#/components/schemas/Error' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '../../shared/errors.yaml#/components/schemas/Error' }
        '403':
          description: Current permission denied
          content:
            application/json:
              schema: { $ref: '../../shared/errors.yaml#/components/schemas/Error' }
        '404':
          description: Resource not found
          content:
            application/json:
              schema: { $ref: '../../shared/errors.yaml#/components/schemas/Error' }
        '409':
          description: Version, identity, eligibility or claim conflict
          content:
            application/json:
              schema: { $ref: '../../shared/errors.yaml#/components/schemas/Error' }
        '429':
          description: Too many requests
          content:
            application/json:
              schema: { $ref: '../../shared/errors.yaml#/components/schemas/Error' }
        '503':
          description: Delivery unavailable
          content:
            application/json:
              schema: { $ref: '../../shared/errors.yaml#/components/schemas/Error' }
