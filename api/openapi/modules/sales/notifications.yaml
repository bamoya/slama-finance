  /v1/documents/{documentType}/{id}/notifications:
    get:
      operationId: listDocumentNotifications
      tags: [sales]
      description: Requires owner read and notification_dispatches.read. Includes preparation jobs separately from dispatches. Sent means accepted by provider, not delivered.
      parameters:
        - { name: documentType, in: path, required: true, schema: { type: string, enum: [invoice, estimate, report_run] } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTimeline' }
