components:
  schemas:
    SendDocumentInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, requestId]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        requestId: { type: string, format: uuid }
    NotificationPreparation:
      type: object
      additionalProperties: false
      required: [jobId, status, recipient, sourceVersion]
      properties:
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        recipient: { type: string, format: email }
        sourceVersion: { type: integer, minimum: 1 }
    NotificationTimelineItem:
      type: object
      additionalProperties: false
      required: [id, kind, status, createdAt, attempts, errorCode, recipient, eventKey]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [preparation, dispatch] }
        status: { type: string, enum: [queued, running, succeeded, sending, sent, failed, cancelled, skipped] }
        createdAt: { type: string, format: date-time }
        attempts: { type: integer, minimum: 0 }
        errorCode: { type: [string, 'null'] }
        recipient: { type: [string, 'null'] }
        eventKey: { type: string }
    NotificationTimeline:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/NotificationTimelineItem' } }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
