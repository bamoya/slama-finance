paths:
  /v1/payments/{id}/receipt:
    post:
      operationId: preparePaymentReceipt
      description: Prepare a receipt on demand or reuse its current PDF. Requires payments.read; issuing the first receipt additionally requires payments.update. Previously issued receipts remain downloadable with read access. Successful publication prevents permanent payment deletion. Historical balances are captured at recording; legacy payments explicitly have no historical balance. Pending cheques are acknowledged as received, not collected.
      x-permissions: [payments.read]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Receipt PDF ready for download
          content:
            application/json:
              schema: { $ref: './artifacts.yaml#/components/schemas/RegeneratedDocumentPdf' }
        '403': { description: Missing payments.read permission }
        '404': { description: Payment not found }
        '409': { description: Payment changed during rendering; retry }
        '503': { description: PDF rendering or storage unavailable }
  /v1/payments:
    get:
      operationId: listPayments
      x-permissions: [payments.read]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: invoiceId, in: query, schema: { type: string, format: uuid } }
        - { name: clientId, in: query, schema: { type: string, format: uuid } }
        - { name: method, in: query, schema: { type: string, enum: [cash, bank_transfer, cheque] } }
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [pending, confirmed, cancelled] },
          }
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, schema: { type: string, format: date } }
        - {
            name: sort,
            in: query,
            schema:
              { type: string, enum: [newest, oldest, amount_asc, amount_desc], default: newest },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          {
            description: Payment page,
            content: { application/json: { schema: { $ref: '#/components/schemas/PaymentPage' } } },
          }
        default:
          {
            description: Error,
            content:
              {
                application/json:
                  { schema: { $ref: '../../openapi.yaml#/components/schemas/Error' } },
              },
          }
    post:
      operationId: createPayment
      description: Requires payments.create. A directly confirmed bank transfer also requires payments.update; cash is confirmed immediately with payments.create.
      x-permissions: [payments.create]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: '#/components/schemas/PaymentInput' } } },
        }
      responses:
        '201':
          {
            description: Recorded payment,
            content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } },
          }
        default:
          {
            description: Error,
            content:
              {
                application/json:
                  { schema: { $ref: '../../openapi.yaml#/components/schemas/Error' } },
              },
          }
  /v1/payments/{id}:
    get:
      operationId: getPayment
      x-permissions: [payments.read]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          {
            description: Payment,
            content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } },
          }
        default:
          {
            description: Error,
            content:
              {
                application/json:
                  { schema: { $ref: '../../openapi.yaml#/components/schemas/Error' } },
              },
          }
    delete:
      operationId: deletePayment
      description: Permanently deletes a payment only if no receipt has been issued, after an expectedVersion check. Otherwise returns 409 RECEIPT_ISSUED; cancel the payment instead. The deletion is audited and releases any confirmed or pending invoice balance.
      x-permissions: [payments.delete]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/PaymentVersion' } } },
        }
      responses:
        '204': { description: Payment deleted }
        default:
          {
            description: Error,
            content:
              {
                application/json:
                  { schema: { $ref: '../../openapi.yaml#/components/schemas/Error' } },
              },
          }
  /v1/payments/{id}/confirm:
    post:
      operationId: confirmPayment
      x-permissions: [payments.update]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/PaymentConfirmation' } } },
        }
      responses:
        '200':
          {
            description: Confirmed payment,
            content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } },
          }
        default:
          {
            description: Error,
            content:
              {
                application/json:
                  { schema: { $ref: '../../openapi.yaml#/components/schemas/Error' } },
              },
          }
  /v1/payments/{id}/cancel:
    post:
      operationId: cancelPayment
      x-permissions: [payments.update]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/PaymentCancellation' } } },
        }
      responses:
        '200':
          {
            description: Cancelled payment,
            content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } },
          }
        default:
          {
            description: Error,
            content:
              {
                application/json:
                  { schema: { $ref: '../../openapi.yaml#/components/schemas/Error' } },
              },
          }
  /v1/payments/{id}/restore:
    post:
      operationId: restorePayment
      description: Restores a cancelled payment to its prior pending or confirmed state if its invoice is payable and balance remains available.
      x-permissions: [payments.update]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/PaymentVersion' } } },
        }
      responses:
        '200':
          {
            description: Restored payment,
            content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } },
          }
        default:
          {
            description: Error,
            content:
              {
                application/json:
                  { schema: { $ref: '../../openapi.yaml#/components/schemas/Error' } },
              },
          }
components:
  schemas:
    PaymentReceiptSnapshot:
      type: object
      additionalProperties: false
      required: [invoiceNumber, invoiceTotal, issuer, client, appearance, templateId, capturedAt, paidAtRecording, remainingAtRecording]
      properties:
        invoiceNumber: { type: string }
        invoiceTotal: { type: string }
        issuer: { type: object, additionalProperties: true }
        client: { type: object, additionalProperties: true }
        appearance: { type: object, additionalProperties: true }
        templateId: { type: [string, 'null'], format: uuid }
        capturedAt: { type: [string, 'null'], format: date-time }
        paidAtRecording: { type: [string, 'null'] }
        remainingAtRecording: { type: [string, 'null'] }
    PaymentVersion:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties: { expectedVersion: { type: integer, minimum: 1 } }
    PaymentInput:
      type: object
      additionalProperties: false
      required:
        [
          operationId,
          invoiceId,
          amount,
          currency,
          method,
          status,
          paymentDate,
          collectedOn,
          bankAccountId,
          reference,
          chequeBank,
          chequeNumber,
        ]
      properties:
        operationId: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid }
        amount:
          { type: string, pattern: '^(?!0(?:\.0{1,2})?$)(?:0|[1-9][0-9]{0,15})(?:\.[0-9]{1,2})?$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        method: { type: string, enum: [cash, bank_transfer, cheque] }
        status: { type: string, enum: [pending, confirmed] }
        paymentDate: { type: string, format: date }
        collectedOn: { type: [string, 'null'], format: date }
        bankAccountId: { type: [string, 'null'], format: uuid }
        reference: { type: [string, 'null'], maxLength: 200 }
        chequeBank: { type: [string, 'null'], maxLength: 200 }
        chequeNumber: { type: [string, 'null'], maxLength: 100 }
    PaymentConfirmation:
      type: object
      additionalProperties: false
      required: [expectedVersion, collectedOn]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        collectedOn: { type: string, format: date }
    PaymentCancellation:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    Payment:
      type: object
      additionalProperties: false
      required:
        [
          id,
          number,
          receiptNumber,
          receiptIssuedAt,
          invoiceId,
          invoiceNumber,
          clientId,
          clientName,
          amount,
          currency,
          method,
          status,
          paymentDate,
          collectedOn,
          bankAccountId,
          reference,
          chequeBank,
          chequeNumber,
          cancellationReason,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        receiptNumber: { type: string }
        receiptIssuedAt: { type: [string, 'null'], format: date-time }
        invoiceId: { type: string, format: uuid }
        invoiceNumber: { type: string }
        clientId: { type: string, format: uuid }
        clientName: { type: string }
        amount: { type: string }
        currency: { type: string }
        method: { type: string, enum: [cash, bank_transfer, cheque] }
        status: { type: string, enum: [pending, confirmed, cancelled] }
        paymentDate: { type: string, format: date }
        collectedOn: { type: [string, 'null'], format: date }
        bankAccountId: { type: [string, 'null'], format: uuid }
        reference: { type: [string, 'null'] }
        chequeBank: { type: [string, 'null'] }
        chequeNumber: { type: [string, 'null'] }
        cancellationReason: { type: [string, 'null'] }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaymentPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Payment' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
