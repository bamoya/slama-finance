paths:
  /v1/estimates:
    get:
      operationId: listEstimates
      x-permissions: [estimates.read]
      parameters:
        - {
            name: status,
            in: query,
            schema:
              {
                type: string,
                enum: [all, draft, issued, sent, accepted, rejected, expired, cancelled, superseded],
                default: all,
              },
          }
        - { name: clientId, in: query, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, schema: { type: string, format: date } }
        - {
            name: amountMin,
            in: query,
            schema: { type: string, pattern: '^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$' },
          }
        - {
            name: amountMax,
            in: query,
            schema: { type: string, pattern: '^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$' },
          }
        - {
            name: sortBy,
            in: query,
            schema:
              {
                type: string,
                enum: [createdAt, issueDate, validUntil, number, clientName, total],
                default: createdAt,
              },
          }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          {
            description: Estimate page,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/EstimatePage' } } },
          }
    post:
      operationId: createEstimate
      x-permissions: [estimates.create]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: '#/components/schemas/EstimateInput' } } },
        }
      responses:
        '201':
          {
            description: Draft estimate,
            content: { application/json: { schema: { $ref: '#/components/schemas/Estimate' } } },
          }
  /v1/estimates/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getEstimate
      x-permissions: [estimates.read]
      responses:
        '200':
          {
            description: Estimate,
            content: { application/json: { schema: { $ref: '#/components/schemas/Estimate' } } },
          }
    patch:
      operationId: updateEstimate
      x-permissions: [estimates.update]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/EstimateUpdate' } } },
        }
      responses:
        '200':
          {
            description: Updated draft,
            content: { application/json: { schema: { $ref: '#/components/schemas/Estimate' } } },
          }
    delete:
      operationId: deleteEstimate
      x-permissions: [estimates.delete]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/EstimateVersion' } } },
        }
      responses:
        '204': { description: Deleted draft }
  /v1/estimates/{id}/revisions:
    post:
      operationId: createEstimateRevision
      x-permissions: [estimates.create, estimates.read]
      description: Copy a current finalized estimate into one editable draft revision. Requires estimates.read and estimates.create. Repeated requests return the existing draft. Issuing the revision atomically supersedes its predecessor; existing invoices and payments never change. Cancelled and superseded estimates cannot be revised.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstimateVersion' }
      responses:
        '200':
          description: New or existing draft revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estimate' }
        '403': { description: Missing read or create permission }
        '409': { description: Estimate changed or cannot be revised }
  /v1/estimates/{id}/issue:
    post:
      operationId: issueEstimate
      x-permissions: [estimates.update]
      description: Finalize a draft using current client identity and contact details. The client snapshot is frozen after issue, including during PDF regeneration. Products and prices remain as saved in the draft.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/EstimateVersion' } } },
        }
      responses:
        '200':
          {
            description: Issued estimate,
            content: { application/json: { schema: { $ref: '#/components/schemas/Estimate' } } },
          }
  /v1/estimates/{id}/accept:
    post:
      operationId: acceptEstimate
      x-permissions: [estimates.update]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/EstimateVersion' } } },
        }
      responses:
        '200':
          {
            description: Accepted estimate,
            content: { application/json: { schema: { $ref: '#/components/schemas/Estimate' } } },
          }
  /v1/estimates/{id}/reject:
    post:
      operationId: rejectEstimate
      x-permissions: [estimates.update]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/EstimateVersion' } } },
        }
      responses:
        '200':
          {
            description: Rejected estimate,
            content: { application/json: { schema: { $ref: '#/components/schemas/Estimate' } } },
          }
  /v1/estimates/{id}/cancel:
    post:
      operationId: cancelEstimate
      x-permissions: [estimates.update]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/EstimateCancellation' } } },
        }
      responses:
        '200':
          {
            description: Cancelled estimate,
            content: { application/json: { schema: { $ref: '#/components/schemas/Estimate' } } },
          }
  /v1/estimates/{id}/pdf:
    post:
      operationId: prepareEstimatePdf
      x-permissions: [estimates.read]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '202':
          {
            description: PDF preparation queued,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/EstimatePdfJob' } } },
          }
  /v1/estimates/{id}/artifacts:
    get:
      operationId: listEstimateArtifacts
      x-permissions: [estimates.read]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          {
            description: Stored PDFs,
            content:
              {
                application/json:
                  {
                    schema:
                      { type: array, items: { $ref: '#/components/schemas/EstimateArtifact' } },
                  },
              },
          }
components:
  schemas:
    EstimateVersion:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties: { expectedVersion: { type: integer, minimum: 1 } }
    EstimateCancellation:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    EstimateLineInput:
      type: object
      additionalProperties: false
      required: [productVariantId, productName, quantity, unitPrice, vatRate]
      properties:
        productVariantId: { type: [string, 'null'], format: uuid }
        productName: { type: string, minLength: 1, maxLength: 200 }
        quantity: { type: integer, minimum: 1, maximum: 1000000 }
        unitPrice: { type: string, pattern: '^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$' }
        vatRate: { type: [string, 'null'], pattern: '^(0|[1-9][0-9]?|100)(\.[0-9]{1,2})?$' }
    EstimateInput:
      type: object
      additionalProperties: false
      required: [clientId, templateId, issueDate, validUntil, notes, paymentTerms, lines]
      properties:
        clientId: { type: string, format: uuid }
        templateId: { type: [string, 'null'], format: uuid }
        localeOverride: { type: [string, 'null'], enum: [fr-MA, en-GB, null] }
        issueDate: { type: string, format: date }
        validUntil: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'], maxLength: 4000 }
        paymentTerms: { type: [string, 'null'], maxLength: 4000 }
        lines:
          { type: array, maxItems: 100, items: { $ref: '#/components/schemas/EstimateLineInput' } }
    EstimateUpdate:
      type: object
      additionalProperties: false
      required:
        [expectedVersion, clientId, templateId, issueDate, validUntil, notes, paymentTerms, lines]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        clientId: { type: string, format: uuid }
        templateId: { type: [string, 'null'], format: uuid }
        localeOverride: { type: [string, 'null'], enum: [fr-MA, en-GB, null] }
        issueDate: { type: string, format: date }
        validUntil: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'], maxLength: 4000 }
        paymentTerms: { type: [string, 'null'], maxLength: 4000 }
        lines:
          { type: array, maxItems: 100, items: { $ref: '#/components/schemas/EstimateLineInput' } }
    EstimateLine:
      type: object
      additionalProperties: false
      required:
        [
          id,
          position,
          productId,
          productVariantId,
          productName,
          productReference,
          packageWeightG,
          quantity,
          unitPrice,
          vatRate,
          netAmount,
          taxAmount,
          totalAmount,
        ]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        productId: { type: [string, 'null'], format: uuid }
        productVariantId: { type: [string, 'null'], format: uuid }
        productName: { type: string }
        productReference: { type: [string, 'null'] }
        packageWeightG: { type: [integer, 'null'] }
        quantity: { type: integer }
        unitPrice: { type: string }
        vatRate: { type: [string, 'null'] }
        netAmount: { type: string }
        taxAmount: { type: string }
        totalAmount: { type: string }
    Estimate:
      type: object
      additionalProperties: false
      required:
        [
          id,
          number,
          status,
          clientId,
          clientDisplayName,
          templateId,
          issueDate,
          validUntil,
          currency,
          locale,
          notes,
          paymentTerms,
          subtotal,
          taxTotal,
          total,
          version,
          contentVersion,
          lines,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        number: { type: [string, 'null'] }
        status:
          { type: string, enum: [draft, issued, sent, accepted, rejected, expired, cancelled, superseded] }
        revisionOfId: { type: [string, 'null'], format: uuid, description: Previous estimate in the revision chain }
        revisionId: { type: [string, 'null'], format: uuid, description: Draft or issued direct successor }
        clientId: { type: string, format: uuid }
        clientDisplayName: { type: string }
        templateId: { type: [string, 'null'], format: uuid }
        localeOverride: { type: [string, 'null'], enum: [fr-MA, en-GB, null] }
        issueDate: { type: string, format: date }
        validUntil: { type: [string, 'null'], format: date }
        currency: { type: string }
        locale: { type: string }
        notes: { type: [string, 'null'] }
        paymentTerms: { type: [string, 'null'] }
        subtotal: { type: string }
        taxTotal: { type: string }
        total: { type: string }
        version: { type: integer }
        contentVersion: { type: integer }
        lines: { type: array, items: { $ref: '#/components/schemas/EstimateLine' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EstimatePage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Estimate' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    EstimatePdfJob:
      type: object
      additionalProperties: false
      required: [jobId, status]
      properties:
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
    EstimateArtifact:
      type: object
      additionalProperties: false
      required: [id, sourceVersion, format, byteSize, generatedAt]
      properties:
        id: { type: string, format: uuid }
        sourceVersion: { type: integer }
        format: { type: string, enum: [pdf] }
        byteSize: { type: integer }
        generatedAt: { type: string, format: date-time }
