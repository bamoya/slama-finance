openapi: 3.1.0
info: { title: Sales cancellation, version: 0.1.0 }
paths:
  /v1/sales/cancellation/preview:
    post:
      operationId: previewSalesCancellation
      tags: [sales]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesCancellationSelection' }
      responses:
        '200':
          description: Current single or atomic bulk cancellation impact. Invoices and other documents are preserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesCancellationImpact' }
        default:
          description: Invalid selection, missing permissions or stale versions.
          content:
            application/json:
              schema: { $ref: '../../shared/errors.yaml#/components/schemas/Error' }
  /v1/sales/cancellation:
    post:
      operationId: confirmSalesCancellation
      tags: [sales]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmSalesCancellation' }
      responses:
        '204': { description: Entire selection cancelled atomically. }
        default:
          description: Nothing changed; review the impact again.
          content:
            application/json:
              schema: { $ref: '../../shared/errors.yaml#/components/schemas/Error' }
components:
  schemas:
    SalesCancellationSelection:
      type: object
      additionalProperties: false
      required: [resource, records]
      properties:
        resource: { type: string, enum: [estimates, delivery_notes, payments] }
        records:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '../../shared/impact.yaml#/components/schemas/DeletionRecord' }
    ConfirmSalesCancellation:
      type: object
      additionalProperties: false
      required: [resource, records, reason, token]
      properties:
        resource: { $ref: '#/components/schemas/SalesCancellationSelection/properties/resource' }
        records: { $ref: '#/components/schemas/SalesCancellationSelection/properties/records' }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        token: { type: string, minLength: 1, maxLength: 1000 }
    SalesCancellationImpact:
      type: object
      additionalProperties: false
      required: [token, expiresAt, resource, records, receipts]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        resource: { $ref: '#/components/schemas/SalesCancellationSelection/properties/resource' }
        records:
          type: array
          items: { $ref: './actions.yaml#/components/schemas/CancellationImpactRecord' }
        receipts: { type: integer, minimum: 0 }
