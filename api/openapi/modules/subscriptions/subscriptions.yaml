paths:
  /api/v1/owner/subscription:
    get:
      operationId: getOwnerSubscription
      tags: [subscriptions]
      description: 'Resolved at one instant from the pinned version of the current coverage, the active owner override and independent restrictions. 503 SUBSCRIPTION_CATALOG_UNAVAILABLE when the pinned version is missing or invalid (never a fallback); billing and payments stay readable.'
      security: [{ ownerSessionCookie: [] }]
      responses:
        '200':
          description: Effective plan, exact coverage and admission limits. No payment is implied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerSubscription' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/owner/subscription/billing:
    get:
      operationId: getOwnerBilling
      tags: [subscriptions]
      description: 'Lists only plans with a current selling version; a withdrawn or invalid plan is omitted.'
      security: [{ ownerSessionCookie: [] }]
      responses:
        '200':
          description: Plan prices, tax configuration, accepted payment methods and instructions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingCatalog' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/owner/subscription/quote:
    post:
      operationId: quoteOwnerSubscription
      tags: [subscriptions]
      description: '409 PLAN_NOT_SELLABLE for activation, upgrade or plan change to a withdrawn plan (same-plan renewal keeps its pin); 503 SUBSCRIPTION_CATALOG_UNAVAILABLE.'
      security: [{ ownerSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionQuoteRequest' }
      responses:
        '200':
          description: Exact HT, tax and TTC amounts and the expected kind of change. Nothing is recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionQuote' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/owner/subscription/payments:
    get:
      operationId: listOwnerSubscriptionPayments
      tags: [subscriptions]
      security: [{ ownerSessionCookie: [] }]
      responses:
        '200':
          description: Submitted, confirmed and rejected manual payments, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SubscriptionPayment' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
    post:
      operationId: submitOwnerSubscriptionPayment
      tags: [subscriptions]
      description: 'Records an immutable quote (pinned plan version, price and tax snapshot, valid 15 days) and the owner''s payment declaration against it; the same rules and errors as the quote apply.'
      security: [{ ownerSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionPaymentSubmission' }
      responses:
        '201':
          description: Payment reference recorded for administrator verification. Coverage starts only after confirmation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionPayment' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/owner/subscription/invoices:
    get:
      operationId: listOwnerSubscriptionInvoices
      tags: [subscriptions]
      description: 'Issued invoices and credit notes of the owner, newest first. Amounts are immutable snapshots; balances derive from verified receipts and credit notes.'
      security: [{ ownerSessionCookie: [] }]
      responses:
        '200':
          description: Issued billing documents.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BillingInvoice' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/owner/subscription/cancellation:
    put:
      operationId: setOwnerSubscriptionCancellation
      tags: [subscriptions]
      security: [{ ownerSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionCancellation' }
      responses:
        '200':
          description: Updated subscription. Already-paid coverage is preserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerSubscription' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
components:
  schemas:
    SubscriptionEntitlements:
      description: >-
        Effective owner-subscription entitlements. Null count limits mean unlimited;
        storage and queued-recipient allowances are finite. Normalized catalog storage
        is an additive internal representation; active owner-subscription overrides replace plan values.
      type: object
      additionalProperties: false
      required: [organizations, staffPerOrganization, features, storageBytes, businessEmails]
      properties:
        organizations: { type: [integer, 'null'], minimum: 1 }
        staffPerOrganization: { type: [integer, 'null'], minimum: 0 }
        features:
          type: array
          items:
            {
              type: string,
              enum:
                [
                  custom_templates,
                  business_emails,
                  scheduled_reports,
                  report_exports,
                  staff_roles,
                  advanced_analytics,
                  custom_domains,
                ],
            }
        storageBytes: { type: integer, minimum: 0 }
        businessEmails: { type: integer, minimum: 0 }
    EntitlementKey:
      type: string
      enum:
        [
          organizations,
          staffPerOrganization,
          storageBytes,
          businessEmails,
          custom_templates,
          business_emails,
          scheduled_reports,
          report_exports,
          staff_roles,
          advanced_analytics,
          custom_domains,
        ]
    EntitlementSource:
      type: object
      additionalProperties: false
      description: Origin of one effective value. Never includes administrator notes or identities.
      required: [entitlementKey, source, effectiveUntil]
      properties:
        entitlementKey: { $ref: '#/components/schemas/EntitlementKey' }
        source: { type: string, enum: [plan, override] }
        effectiveUntil:
          {
            type: [string, 'null'],
            format: date-time,
            description: 'End of the applied override; null for plan values or open-ended overrides.',
          }
    OwnerSubscription:
      type: object
      additionalProperties: false
      required:
        [
          planCode,
          planName,
          status,
          trialEndsAt,
          paidThroughAt,
          cycle,
          cancelAtPeriodEnd,
          graceEndsAt,
          blockedAt,
          retentionEndsAt,
          nextPlanCode,
          pendingPayment,
          entitlements,
          organizationCount,
          entitlementSources,
          usage,
          planVersionNumber,
          accessValidUntil,
          scheduledVersionTransition,
        ]
      properties:
        planCode: { type: string, enum: [trial, essential, business, pro] }
        planName: { type: string }
        status:
          {
            type: string,
            enum: [not_started, trial, active, past_due, expired, suspended],
            description: 'suspended: an administrator froze the subscription; access is blocked and the remaining paid or trial time is restored on resume.',
          }
        trialEndsAt: { type: [string, 'null'], format: date-time }
        paidThroughAt: { type: [string, 'null'], format: date-time }
        cycle: { anyOf: [{ $ref: '#/components/schemas/BillingCycle' }, { type: 'null' }] }
        cancelAtPeriodEnd: { type: boolean }
        graceEndsAt:
          {
            type: [string, 'null'],
            format: date-time,
            description: 'Set only for previously paid coverage; trials have no grace.',
          }
        blockedAt: { type: [string, 'null'], format: date-time }
        retentionEndsAt:
          {
            type: [string, 'null'],
            format: date-time,
            description: '90 days after access was blocked. Deletion is not automatic.',
          }
        nextPlanCode:
          {
            anyOf: [{ $ref: '#/components/schemas/PaidPlanCode' }, { type: 'null' }],
            description: 'Plan of already-confirmed future coverage, such as a downgrade at renewal.',
          }
        pendingPayment:
          { anyOf: [{ $ref: '#/components/schemas/SubscriptionPayment' }, { type: 'null' }] }
        entitlements: { $ref: '#/components/schemas/SubscriptionEntitlements' }
        organizationCount: { type: integer, minimum: 0 }
        entitlementSources:
          description: Origin of each effective entitlement at response time (plan value or owner override).
          type: array
          items: { $ref: '#/components/schemas/EntitlementSource' }
        planVersionNumber:
          {
            type: [integer, 'null'],
            minimum: 1,
            description: 'Published catalog version pinned by the coverage that grants access now (trial, paid or complimentary); for not_started, the trial version new trials receive; null only when no coverage ever existed for a paid plan.',
          }
        accessValidUntil:
          {
            type: [string, 'null'],
            format: date-time,
            description: 'Next instant at which the resolved access may change on its own (coverage, grace or trial end, override start/end, scheduled change, next email window). Clients refetch at this instant; null when nothing is scheduled.',
          }
        scheduledVersionTransition:
          anyOf:
            - { $ref: '#/components/schemas/ScheduledVersionTransition' }
            - { type: 'null' }
        usage:
          type: object
          additionalProperties: false
          required: [storageBytes, businessEmails, emailPeriodStart, emailPeriodEnd]
          properties:
            storageBytes: { type: integer, minimum: 0 }
            businessEmails: { type: integer, minimum: 0 }
            emailPeriodStart: { type: [string, 'null'], format: date-time }
            emailPeriodEnd: { type: [string, 'null'], format: date-time }
    ScheduledVersionTransition:
      type: object
      additionalProperties: false
      description: 'Notified move of this plan to a newer published version. Applies only to a renewal starting at or after effectiveAt, at least 30 days after noticeSentAt; already-paid periods keep their version.'
      required: [targetVersionNumber, effectiveAt, noticeSentAt]
      properties:
        targetVersionNumber: { type: integer, minimum: 1 }
        effectiveAt: { type: string, format: date-time }
        noticeSentAt: { type: string, format: date-time }
    PaidPlanCode: { type: string, enum: [essential, business, pro] }
    BillingCycle: { type: string, enum: [monthly, annual] }
    MoneyBreakdown:
      type: object
      additionalProperties: false
      required: [currency, amountHt, taxRateBasisPoints, taxAmount, amountTtc]
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        amountHt: { type: integer, minimum: 0, description: 'Centimes, excluding tax.' }
        taxRateBasisPoints: { type: [integer, 'null'], minimum: 0, maximum: 10000 }
        taxAmount: { type: integer, minimum: 0 }
        amountTtc: { type: integer, minimum: 0 }
    BillingCatalog:
      type: object
      additionalProperties: false
      required: [currency, taxRateBasisPoints, paymentMethods, paymentInstructions, plans]
      properties:
        currency: { type: string }
        taxRateBasisPoints: { type: [integer, 'null'], minimum: 0, maximum: 10000 }
        paymentMethods:
          type: array
          items: { type: string }
        paymentInstructions: { type: string }
        plans:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, versionNumber, name, monthlyHt, annualHt, entitlements]
            properties:
              code: { $ref: '#/components/schemas/PaidPlanCode' }
              versionNumber:
                {
                  type: integer,
                  minimum: 1,
                  description: 'Current selling version. Withdrawn plans are omitted.',
                }
              name: { type: string }
              monthlyHt: { type: integer, minimum: 0 }
              annualHt: { type: integer, minimum: 0 }
              entitlements: { $ref: '#/components/schemas/SubscriptionEntitlements' }
    SubscriptionQuoteRequest:
      type: object
      additionalProperties: false
      required: [planCode, cycle]
      properties:
        planCode: { $ref: '#/components/schemas/PaidPlanCode' }
        cycle: { $ref: '#/components/schemas/BillingCycle' }
    SubscriptionQuote:
      type: object
      additionalProperties: false
      required: [planCode, planVersionNumber, cycle, kind, amount, coverageStart, coverageEnd]
      properties:
        planCode: { $ref: '#/components/schemas/PaidPlanCode' }
        planVersionNumber:
          {
            type: integer,
            minimum: 1,
            description: 'Version whose terms and price this quote uses: the current pin for a same-plan renewal (or an eligible notified transition target), otherwise the selling version.',
          }
        cycle: { $ref: '#/components/schemas/BillingCycle' }
        kind: { type: string, enum: [activation, renewal, upgrade] }
        amount: { $ref: '#/components/schemas/MoneyBreakdown' }
        coverageStart:
          {
            type: string,
            format: date-time,
            description: 'Estimate; final coverage is set at confirmation.',
          }
        coverageEnd: { type: string, format: date-time }
    SubscriptionPaymentSubmission:
      type: object
      additionalProperties: false
      required: [planCode, cycle, method, reference]
      properties:
        planCode: { $ref: '#/components/schemas/PaidPlanCode' }
        cycle: { $ref: '#/components/schemas/BillingCycle' }
        method: { type: string, minLength: 1, maxLength: 40 }
        reference: { type: string, minLength: 1, maxLength: 120 }
    SubscriptionPayment:
      type: object
      additionalProperties: false
      required:
        [
          id,
          planCode,
          planVersionNumber,
          cycle,
          kind,
          status,
          method,
          reference,
          amount,
          coverageStart,
          coverageEnd,
          submittedAt,
          decidedAt,
          rejectionReason,
          quoteExpiresAt,
          receivedTtc,
          invoiceNumber,
        ]
      properties:
        quoteExpiresAt:
          {
            type: [string, 'null'],
            format: date-time,
            description: 'End of the quote validity. Funds received after it are not accepted for this quote (409 QUOTE_EXPIRED). Null only for administrator adjustments.',
          }
        receivedTtc:
          {
            type: integer,
            minimum: 0,
            description: 'Verified receipts allocated to this payment, in centimes. Coverage starts only when it reaches the amount due.',
          }
        invoiceNumber:
          {
            type: [string, 'null'],
            description: 'Invoice issued at the first verified receipt; null before.',
          }
        id: { type: string, format: uuid }
        planCode: { $ref: '#/components/schemas/PaidPlanCode' }
        planVersionNumber:
          {
            type: integer,
            minimum: 1,
            description: 'Version pinned at submission; confirmation never changes it.',
          }
        cycle: { $ref: '#/components/schemas/BillingCycle' }
        kind: { type: string, enum: [activation, renewal, upgrade] }
        status: { type: string, enum: [submitted, confirmed, rejected] }
        method: { type: string }
        reference: { type: string }
        amount: { $ref: '#/components/schemas/MoneyBreakdown' }
        coverageStart: { type: [string, 'null'], format: date-time }
        coverageEnd: { type: [string, 'null'], format: date-time }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        rejectionReason:
          {
            type: [string, 'null'],
            description: 'Administrator explanation, set only when the payment was rejected.',
          }
    SubscriptionCancellation:
      type: object
      additionalProperties: false
      required: [cancelAtPeriodEnd]
      properties:
        cancelAtPeriodEnd: { type: boolean }
    BillingInvoiceLine:
      type: object
      additionalProperties: false
      required: [position, planCode, planVersionNumber, cycle, kind, amount]
      properties:
        position: { type: integer, minimum: 1 }
        planCode: { $ref: '#/components/schemas/PaidPlanCode' }
        planVersionNumber: { type: integer, minimum: 1 }
        cycle: { $ref: '#/components/schemas/BillingCycle' }
        kind: { type: string, enum: [activation, renewal, upgrade] }
        amount: { $ref: '#/components/schemas/MoneyBreakdown' }
    BillingInvoice:
      type: object
      additionalProperties: false
      description: 'Issued document. Totals and lines never change; corrections are separate credit notes.'
      required:
        [
          id,
          number,
          kind,
          correctsInvoiceNumber,
          reason,
          paymentId,
          totals,
          lines,
          issuedAt,
          allocatedTtc,
          creditedTtc,
          balanceTtc,
          status,
        ]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, description: 'F-YYYY-NNNNNN (invoice) or A-YYYY-NNNNNN (credit note), gap-free per series and Casablanca year.' }
        kind: { type: string, enum: [invoice, credit_note] }
        correctsInvoiceNumber: { type: [string, 'null'] }
        reason: { type: [string, 'null'], description: 'Correction reason, credit notes only.' }
        paymentId: { type: [string, 'null'], format: uuid }
        totals: { $ref: '#/components/schemas/MoneyBreakdown' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/BillingInvoiceLine' }
        issuedAt: { type: string, format: date-time }
        allocatedTtc: { type: integer, minimum: 0, description: 'Verified receipts allocated (invoices only).' }
        creditedTtc: { type: integer, minimum: 0, description: 'Credit notes issued against it (invoices only).' }
        balanceTtc:
          {
            type: integer,
            description: 'totals.amountTtc - allocated - credited for invoices (negative: refund due outside the platform); 0 for credit notes.',
          }
        status:
          {
            type: string,
            enum: [open, settled, refund_due],
            description: 'From balanceTtc: positive open, zero settled, negative refund_due.',
          }
