openapi: 3.1.0
info: { title: Settings deletion, version: 0.1.0 }
paths:
  /v1/settings/deletion/preview:
    post:
      operationId: previewSettingsDeletion
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsDeletionSelection' }
      responses:
        '200':
          description: Roots, detached references and company defaults to clear.
          content:
            application/json:
              schema: { $ref: '../../shared/impact.yaml#/components/schemas/EntityDeletionImpact' }
        default:
          description: Invalid selection, missing permissions or stale impact.
          content:
            application/json:
              schema: { $ref: '../../shared/errors.yaml#/components/schemas/Error' }
  /v1/settings/deletion:
    post:
      operationId: confirmSettingsDeletion
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmSettingsDeletion' }
      responses:
        '204': { description: Entire selection deleted; documents and payments preserved. }
        default:
          description: Nothing changed; review the impact again.
          content:
            application/json:
              schema: { $ref: '../../shared/errors.yaml#/components/schemas/Error' }
components:
  schemas:
    SettingsDeletionSelection:
      type: object
      additionalProperties: false
      required: [resource, records]
      properties:
        resource: { type: string, enum: [bank_accounts, templates] }
        records:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '../../shared/impact.yaml#/components/schemas/DeletionRecord' }
    ConfirmSettingsDeletion:
      type: object
      additionalProperties: false
      required: [resource, records, token]
      properties:
        resource: { $ref: '#/components/schemas/SettingsDeletionSelection/properties/resource' }
        records: { $ref: '#/components/schemas/SettingsDeletionSelection/properties/records' }
        token: { type: string, minLength: 1, maxLength: 1000 }
