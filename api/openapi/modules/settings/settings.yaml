      operationId: listBankAccounts
      x-permissions:
        - bank_accounts.read
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankAccount"
        default:
          description: Validation, authorization, version conflict or service error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Error
    post:
      operationId: createBankAccount
      x-permissions:
        - bank_accounts.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBankAccount"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
        default:
          description: Validation, authorization, version conflict or service error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Error
  /v1/bank-accounts/{id}:
    delete:
      operationId: deleteBankAccount
      x-permissions:
        - bank_accounts.delete
      description: Requires bank_accounts.delete. Permanently deletes only an
        unreferenced record. Retains audit history and assets. Returns 409 when
        referenced or version is stale.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsRecordVersion"
      responses:
        "204":
          description: Deleted
        default:
          description: Authorization, missing record, stale version or referenced record
            conflict
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Error
    get:
      operationId: getBankAccount
      x-permissions:
        - bank_accounts.read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
        default:
          description: Validation, authorization, version conflict or service error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Error
    patch:
      operationId: updateBankAccount
      x-permissions:
        - bank_accounts.update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBankAccount"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
        default:
          description: Validation, authorization, version conflict or service error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Error
  /v1/bank-accounts/{id}/restore:
    post:
      operationId: restoreBankAccount
      x-permissions:
        - bank_accounts.update
      description: Requires bank_accounts.update. Restores an archived account with a
        version check. Active accounts return 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsRecordVersion"
      responses:
        "200":
          description: Restored account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
        default:
          description: Authorization, missing record, stale version or referenced record
            conflict
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Error
  /v1/bank-accounts/{id}/archive:
    post:
      operationId: archiveBankAccount
      x-permissions:
        - bank_accounts.update
