paths:
  /v1/company-settings:
    get:
      operationId: getCompanySettings
      x-permissions:
        - company_settings.read
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"
        default:
          description: Validation, authorization, version conflict or service error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Error
    patch:
      operationId: updateCompanySettings
      x-permissions:
        - company_settings.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanySettings"
      responses:
        "200":
          description: Success
          content:
