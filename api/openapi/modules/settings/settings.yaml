            - string
            - "null"
          maxLength: 300
        addressLine2:
          type:
            - string
            - "null"
          maxLength: 300
        city:
          type:
            - string
            - "null"
          maxLength: 100
        postalCode:
          type:
            - string
            - "null"
          pattern: ^[0-9]{5}$
        countryCode:
          type: string
          enum:
            - MA
        ice:
          type:
            - string
            - "null"
          pattern: ^[0-9]{15}$
        taxIdentifier:
          type:
            - string
            - "null"
          pattern: ^[0-9]{1,20}$
        registrationNumber:
          type:
            - string
            - "null"
          pattern: ^[0-9]{1,20}$
        registrationCity:
          type:
            - string
            - "null"
          maxLength: 100
        professionalTaxNumber:
          type:
            - string
            - "null"
          pattern: ^[0-9]{1,20}$
        email:
          type:
            - string
            - "null"
          format: email
          maxLength: 320
        phone:
          type:
            - string
            - "null"
          maxLength: 30
        logoAssetId:
          type:
            - string
            - "null"
          format: uuid
        currency:
          type: string
          enum:
            - MAD
            - EUR
            - USD
        locale:
          type: string
          enum:
            - fr-MA
            - ar-MA
