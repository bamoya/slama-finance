{
  'paths':
    {
      '/v1/report-schedules/{id}/test-email':
        {
          'post':
            {
              'operationId': 'sendReportScheduleTestEmail',
              'tags': ['reporting'],
              'security': [{ 'sessionCookie': [] }],
              'description': 'Queue a labelled test run using saved settings and the latest completed period as of now. Sends only to the authenticated user. Requires reports.read. Works on disabled, non-archived schedules; never changes nextRunAt. Repeated requests within 60 seconds reuse the same test run. Returns queued, not delivered.',
              'parameters':
                [
                  {
                    'name': 'id',
                    'in': 'path',
                    'required': true,
                    'schema': { 'type': 'string', 'format': 'uuid' },
                  },
                ],
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        { 'schema': { '$ref': '#/components/schemas/ReportVersionInput' } },
                    },
                },
              'responses':
                {
                  '202':
                    {
                      'description': 'Test run accepted',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ReportRun' } },
                        },
                    },
                  '400': { 'description': 'Invalid input' },
                  '401': { 'description': 'Authentication required' },
                  '403': { 'description': 'Missing report access or ineligible recipient' },
                  '404': { 'description': 'Schedule not found' },
                  '409': { 'description': 'Archived schedule or stale version' },
                  '429': { 'description': 'Too many test requests' },
                  '503': { 'description': 'Email delivery unavailable' },
                },
            },
        },
