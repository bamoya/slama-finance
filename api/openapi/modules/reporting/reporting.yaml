                  },
                  {
                    'name': 'limit',
                    'in': 'query',
                    'required': false,
                    'schema': { 'type': 'integer', 'minimum': 1, 'maximum': 100, 'default': 25 },
                  },
                  {
                    'name': 'offset',
                    'in': 'query',
                    'required': false,
                    'schema': { 'type': 'integer', 'minimum': 0, 'default': 0 },
                  },
                  {
                    'name': 'sort',
                    'in': 'query',
                    'required': false,
                    'schema':
                      {
                        'type': 'string',
                        'enum': ['date_asc', 'date_desc', 'amount_asc', 'amount_desc', 'name_asc'],
                        'default': 'date_desc',
                      },
                  },
                  {
                    'in': 'query',
                    'name': 'segment',
                    'schema':
                      {
                        'type': 'string',
                        'maxLength': 100,
                        'description': 'Detail-only bucket, validated for detailSection: aging current/1_30/31_60/61_plus; payment method; estimate lifecycle status; delivery status; or ranking record ID. Does not change overview aggregates.',
                      },
                  },
                  {
                    'in': 'query',
                    'name': 'comparePrevious',
                    'schema':
                      {
                        'type': 'boolean',
                        'description': 'Capture the equal-length preceding activity period in the same repeatable-read transaction. Does not represent historical balances.',
