paths:
  /v1/report-schedules/preview:
    post:
      operationId: previewReportSchedule
      tags: [reporting]
      security: [{ sessionCookie: [] }]
      description: Read-only calendar preview using the same timezone and DST rules as the scheduler. Requires reports.read. Does not save a schedule or enqueue work.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportSchedulePreviewInput' }
      responses:
        '200':
          description: Next occurrence and inclusive calendar period
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSchedulePreview' }
        '400': { description: Invalid cadence or timezone }
        '401': { description: Authentication required }
        '403': { description: Missing report or schedule read permission }
        '429': { description: Too many requests }
        '503': { description: Service unavailable }
components:
  schemas:
    ReportSchedulePreviewInput:
      type: object
      additionalProperties: false
      required: [frequency, weekday, monthDay, localTime, timezone, period]
      properties:
        frequency: { type: string, enum: [daily, weekly, monthly] }
        weekday: { type: [integer, 'null'], minimum: 1, maximum: 7 }
        monthDay: { type: [integer, 'null'], minimum: 1, maximum: 28 }
        localTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        period: { type: string, enum: [previous_day, previous_week, previous_month] }
    ReportSchedulePreview:
      type: object
      additionalProperties: false
      required: [nextRunAt, periodStart, periodEnd, timezone]
      properties:
        nextRunAt: { type: string, format: date-time }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        timezone: { type: string }
