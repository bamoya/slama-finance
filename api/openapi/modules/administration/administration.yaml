paths:
  /api/v1/admin/auth/login:
    post:
      operationId: adminLogin
      tags: [administration]
      security: []
      description: 'Verifies email and password, then starts a short pending session (slama_admin_session cookie) that must be completed with a TOTP code. Unenrolled administrators receive the TOTP secret once. All credential failures return the same 401 INVALID_CREDENTIALS.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLogin' }
      responses:
        '200':
          description: Second factor required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLoginChallenge' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/auth/2fa:
    post:
      operationId: adminVerifyTwoFactor
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Completes enrollment or sign-in with a 6-digit TOTP code. A code is accepted once; the pending session is replaced by a fresh 8-hour session (30-minute idle timeout). Failures return 401 INVALID_CODE; five failures revoke the pending session.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminTwoFactor' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      responses:
        '204':
          description: Session revoked and cookie cleared.
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/auth/me:
    get:
      operationId: getAdminSession
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      responses:
        '200':
          description: Current administrator. Extends the idle timeout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/payments:
    get:
      operationId: listAdminPayments
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [submitted, confirmed, rejected] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
      responses:
        '200':
          description: Manual subscription payments, oldest submitted first for pending, newest first otherwise. 20 per page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPaymentPage' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/payments/{paymentId}/confirm:
    post:
      operationId: confirmAdminPayment
      description: Requires an internal audit reason and UI confirmation; no fresh second factor.
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPaymentConfirmation' }
      responses:
        '200':
          description: 'Records one verified receipt (default: the remaining balance) and allocates it to the payment''s invoice, issued at the first receipt. Coverage is granted once, in the same transaction, when the allocations reach the amount due; a partial receipt leaves the payment submitted. Idempotent: a confirmed payment, or an explicit receipt reference already recorded with the same amount, returns unchanged; a defaulted reference already recorded is 409 RECEIPT_REFERENCE_REQUIRED (never a silent no-op). Lifecycle checks (409 UPGRADE_STALE) run before any receipt; an upgrade is received in full only (400 UPGRADE_REQUIRES_FULL_AMOUNT). 409 PAYMENT_REJECTED; 409 QUOTE_EXPIRED when the first receipt''s receivedAt is after the quote validity (later instalments complete an accepted quote); 409 RECEIPT_REFERENCE_USED; 400 AMOUNT_EXCEEDS_BALANCE; 400 RECEIVED_AT_INVALID (future or before submission).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPayment' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/invoices:
    get:
      operationId: listAdminInvoices
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      parameters:
        - { name: ownerId, in: query, schema: { type: string, format: uuid } }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
      responses:
        '200':
          description: Issued invoices and credit notes, newest first. 20 per page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInvoicePage' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/invoices/{invoiceId}/credit-notes:
    post:
      operationId: createAdminCreditNote
      description: 'Explicit correction: issues a linked credit note at the invoice''s tax rate. Only for an invoice whose payment is decided (confirmed or rejected); credited HT and tax each never exceed the invoice, and the note crediting the remaining HT takes the remaining tax. Coverage is not changed (use lifecycle actions); refunds happen outside the platform. Requires an audit reason and UI confirmation. 409 PAYMENT_PENDING; 400 CREDIT_EXCEEDS_INVOICE.'
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCreditNoteRequest' }
      responses:
        '201':
          description: The issued credit note.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInvoice' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/payments/{paymentId}/reject:
    post:
      operationId: rejectAdminPayment
      description: Requires an internal audit reason and UI confirmation; no fresh second factor.
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPaymentRejection' }
      responses:
        '200':
          description: Rejected payment; the reason is shown to the owner. Idempotent; 409 PAYMENT_CONFIRMED for a confirmed payment; When funds were already received (partial instalments), the same transaction issues a credit note for the whole invoice remainder, so the invoice ends refund_due by the received amount (refund outside the platform); coverage is unchanged, the credit note is audited with the rejection, and the owner can submit a new payment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPayment' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/owners:
    get:
      operationId: listAdminOwners
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      parameters:
        - name: search
          in: query
          description: Case-insensitive match on email or name.
          schema: { type: string, maxLength: 120 }
        - name: status
          in: query
          description: Subscription lifecycle status, evaluated with the coverage rules.
          schema: { type: string, enum: [not_started, trial, active, past_due, expired, suspended] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
      responses:
        '200':
          description: Platform owners, newest first. 20 per page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOwnerPage' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
    post:
      operationId: createAdminOwner
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Creates an owner account without organization and emails a one-time set-password invitation valid 72 hours. 409 EMAIL_TAKEN when the email exists; 503 EMAIL_UNAVAILABLE when owner email is not configured.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminOwnerCreate' }
      responses:
        '201':
          description: Created customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOwnerDetail' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/owners/{ownerId}:
    get:
      operationId: getAdminOwner
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      parameters:
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Owner profile basics, organizations, subscription and payment history. Never tenant finance data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOwnerDetail' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/owners/{ownerId}/invitation:
    post:
      operationId: resendAdminOwnerInvitation
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Sends a new set-password invitation (72 hours) and invalidates earlier ones. 409 INVITATION_NOT_PENDING once the owner has set a password.'
      parameters:
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReason' }
      responses:
        '204':
          description: Done.
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/owners/{ownerId}/block:
    post:
      operationId: blockAdminOwner
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires a reason and UI confirmation; no fresh second factor. Blocks the owner portal and every organization of the owner, revoking all their sessions. Payment never lifts it. 409 ALREADY_BLOCKED.'
      parameters:
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSensitiveAction' }
      responses:
        '200':
          description: Updated customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOwnerDetail' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/owners/{ownerId}/unblock:
    post:
      operationId: unblockAdminOwner
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires an internal audit reason and UI confirmation; no fresh second factor. Lifts the block. Other restrictions (scheduled deletion, organization or subscription suspension) remain. 409 NOT_BLOCKED.'
      parameters:
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSensitiveAction' }
      responses:
        '200':
          description: Updated customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOwnerDetail' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/owners/{ownerId}/deletion:
    post:
      operationId: scheduleAdminOwnerDeletion
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires a reason and UI confirmation; no fresh second factor. Immediately blocks the owner and all organizations and schedules permanent deletion 30 days later. The purge itself is not automatic yet. 409 DELETION_SCHEDULED.'
      parameters:
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSensitiveAction' }
      responses:
        '200':
          description: Updated customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOwnerDetail' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/owners/{ownerId}/deletion/cancel:
    post:
      operationId: cancelAdminOwnerDeletion
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires an internal audit reason and UI confirmation; no fresh second factor. Cancels a scheduled deletion before its due date, restoring the previous state including any outstanding restriction. 409 DELETION_NOT_SCHEDULED or DELETION_DUE.'
      parameters:
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSensitiveAction' }
      responses:
        '200':
          description: Updated customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOwnerDetail' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/owners/{ownerId}/subscription/suspend:
    post:
      operationId: suspendAdminSubscription
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires a reason and UI confirmation; no fresh second factor. Blocks access and freezes the coverage clock. 409 SUBSCRIPTION_NOT_STARTED or SUBSCRIPTION_SUSPENDED.'
      parameters:
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSensitiveAction' }
      responses:
        '200':
          description: Updated customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOwnerDetail' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/owners/{ownerId}/subscription/resume:
    post:
      operationId: resumeAdminSubscription
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires a reason and UI confirmation; no fresh second factor. Restores access and shifts remaining paid or trial time by the suspended duration. 409 SUBSCRIPTION_NOT_SUSPENDED.'
      parameters:
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSensitiveAction' }
      responses:
        '200':
          description: Updated customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOwnerDetail' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/owners/{ownerId}/subscription/plan:
    post:
      operationId: changeAdminSubscriptionPlan
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires a reason and UI confirmation; no fresh second factor. Paid subscriptions only: switches the current paid period to another plan immediately without payment, preserving the existing coverage start and end (recorded as a confirmed 0-amount admin_adjustment payment and a complimentary coverage period). Trial customers use subscription/activation. Downgrades never delete data. The new period pins the target plan selling version. 409 NO_PAID_PERIOD, SAME_PLAN, PLAN_NOT_SELLABLE or SUBSCRIPTION_SUSPENDED.'
      parameters:
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPlanChange' }
      responses:
        '200':
          description: Updated customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOwnerDetail' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/owners/{ownerId}/subscription/extension:
    post:
      operationId: extendAdminSubscription
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires a reason and UI confirmation; no fresh second factor. Adds days to paid coverage (an admin_adjustment payment and complimentary period continuing the last plan and its pinned version) or, without paid coverage, to the trial. 409 SUBSCRIPTION_NOT_STARTED or SUBSCRIPTION_SUSPENDED.'
      parameters:
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCoverageExtension' }
      responses:
        '200':
          description: Updated customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOwnerDetail' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/owners/{ownerId}/entitlement-overrides:
    get:
      operationId: listAdminEntitlementOverrides
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Override history of one owner subscription, newest first, including revoked and expired records. 404 NOT_FOUND.'
      parameters:
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Override records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminEntitlementOverrideList' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
    post:
      operationId: createAdminEntitlementOverride
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires a reason and UI confirmation; no fresh second factor. Replaces one plan value for this owner subscription over a half-open window. startsOn/endsOn are calendar days in the customer timezone (Africa/Casablanca by default, returned as timezone); an absent start or today starts now, a later day at its midnight, a past day is 400 OVERRIDE_START_IN_PAST; endsOn is exclusive (ends at the midnight of that day) and must be after the start (400 OVERRIDE_VALUE_INVALID). Stored and returned as UTC instants. replacesId revokes that record in the same transaction (amendment). 400 OVERRIDE_VALUE_INVALID, 409 OVERRIDE_OVERLAP, 409 OVERRIDE_NOT_REPLACEABLE, 404 NOT_FOUND.'
      parameters:
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminEntitlementOverrideCreate' }
      responses:
        '201':
          description: Created override.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminEntitlementOverride' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/owners/{ownerId}/entitlement-overrides/{overrideId}/revoke:
    post:
      operationId: revokeAdminEntitlementOverride
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires a reason and UI confirmation; no fresh second factor. Ends the override now (or cancels it before its start); the record is kept for review. 409 OVERRIDE_NOT_REVOCABLE when already revoked or ended, 404 NOT_FOUND.'
      parameters:
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: overrideId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminOverrideRevocation' }
      responses:
        '200':
          description: Revoked override.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminEntitlementOverride' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/organizations/{organizationId}/suspend:
    post:
      operationId: suspendAdminOrganization
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires a reason and UI confirmation; no fresh second factor. Suspends one organization: sessions are revoked, logins and workers stop. Only an administrator can reactivate. Returns the owning customer. 409 ORGANIZATION_SUSPENDED.'
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSensitiveAction' }
      responses:
        '200':
          description: Updated customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOwnerDetail' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/organizations/{organizationId}/slug:
    post:
      operationId: renameAdminOrganizationSlug
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires a reason and UI confirmation; no fresh second factor. Changes the organization address; the former slug is kept so the old host redirects, all organization sessions are revoked, and the change is audited (organization.rename_slug). 400 SLUG_INVALID, 400 SLUG_RESERVED, 409 SLUG_TAKEN, 409 SLUG_UNCHANGED, 404 NOT_FOUND.'
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminOrganizationSlugChange' }
      responses:
        '200':
          description: Updated customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOwnerDetail' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/organizations/{organizationId}/reactivate:
    post:
      operationId: reactivateAdminOrganization
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires an internal audit reason and UI confirmation; no fresh second factor. Lifts an administrator suspension; users sign in again. Returns the owning customer. 409 ORGANIZATION_NOT_SUSPENDED.'
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSensitiveAction' }
      responses:
        '200':
          description: Updated customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOwnerDetail' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/billing-settings:
    get:
      operationId: getAdminBillingSettings
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      responses:
        '200':
          description: Platform billing configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBillingSettings' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
    put:
      operationId: updateAdminBillingSettings
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Applies to future quotes only; submitted payments keep their tax snapshot. Currency is read-only.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminBillingSettingsUpdate' }
      responses:
        '200':
          description: Updated configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBillingSettings' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/audit:
    get:
      operationId: listAdminAudit
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
      responses:
        '200':
          description: Administrator audit trail, newest first. 50 per page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuditPage' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/overview:
    get:
      operationId: getAdminOverview
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Subscription counts for the administration dashboard, evaluated at request time with the same coverage rules as the owner subscription lifecycle.'
      responses:
        '200':
          description: Current counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverview' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/auth/passkey/options:
    post:
      operationId: startAdminPasskeyLogin
      tags: [administration]
      security: []
      description: 'Issues WebAuthn authentication options for a discoverable passkey (userVerification required, single-use challenge valid 5 minutes, bound to challengeId). Creates no session.'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPasskeyChallenge' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/auth/passkey:
    post:
      operationId: verifyAdminPasskeyLogin
      tags: [administration]
      security: []
      description: 'Verifies the assertion (challenge, origin, RP ID, user verification, signature counter) and the active administrator; issues a full 8-hour session (30-minute idle) without TOTP. Any failure returns 401 INVALID_CREDENTIALS and consumes the challenge.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPasskeyAssertion' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/auth/recovery:
    post:
      operationId: recoverAdminSignIn
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Completes a pending password sign-in with a single-use recovery code instead of TOTP. Consumes the code, revokes every other session of the administrator and issues a fresh session that counts as reauthenticated for 5 minutes so the administrator can reset TOTP, remove lost passkeys or regenerate codes. Failures return 401 INVALID_CODE and share the five-failure limit of the pending session.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRecoveryCodeSubmission' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/auth/reauthentication/options:
    post:
      operationId: startAdminReauthentication
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Issues WebAuthn authentication options restricted to the signed-in administrator passkeys (userVerification required, single-use, 5 minutes).'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPasskeyChallenge' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/auth/reauthentication:
    post:
      operationId: reauthenticateAdmin
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Proves presence for credential changes: method passkey (challengeId + credential) or password_totp (password + code). Marks the current session reauthenticated for 5 minutes. 401 REAUTHENTICATION_FAILED; five failures revoke the session.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReauthentication' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReauthenticationResult' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/security:
    get:
      operationId: getAdminSecurity
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Security settings of the signed-in administrator: TOTP, passkeys, remaining recovery codes and reauthentication window.'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSecurity' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/security/passkeys/options:
    post:
      operationId: startAdminPasskeyRegistration
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires reauthentication (403 REAUTHENTICATION_REQUIRED). Issues WebAuthn registration options (resident key required, userVerification required, excludes existing credentials, single-use, 5 minutes).'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPasskeyChallenge' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/security/passkeys:
    post:
      operationId: registerAdminPasskey
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires reauthentication. Verifies the attestation response (challenge, origin, RP ID, user verification) and stores the named passkey. 400 PASSKEY_INVALID, 409 PASSKEY_EXISTS, 409 PASSKEY_LIMIT (10). Audited admin.passkey_add.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPasskeyRegistration' }
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPasskey' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/security/passkeys/{passkeyId}:
    delete:
      operationId: removeAdminPasskey
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires reauthentication. Removes one passkey of the signed-in administrator; password and TOTP always remain. 404 NOT_FOUND. Audited admin.passkey_remove.'
      parameters:
        - { name: passkeyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Done.
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/security/recovery-codes:
    post:
      operationId: regenerateAdminRecoveryCodes
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires reauthentication. Invalidates every earlier recovery code and returns 10 new single-use codes, shown once and stored only as hashes. Audited admin.recovery_codes_regenerate.'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRecoveryCodes' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/security/totp:
    post:
      operationId: resetAdminTotp
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires reauthentication. Starts TOTP re-enrollment: returns a new secret shown once; the previous secret stays valid until confirmTotp succeeds.'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTotpEnrollment' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/security/totp/confirm:
    post:
      operationId: confirmAdminTotp
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Requires reauthentication. Confirms the pending TOTP secret with a current code, replaces the old secret and revokes every other session. 401 INVALID_CODE, 409 TOTP_NOT_PENDING. Audited admin.totp_reset.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminTwoFactor' }
      responses:
        '204':
          description: Done.
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
  /api/v1/admin/owners/{ownerId}/subscription/activation:
    post:
      operationId: activateAdminSubscriptionPlan
      tags: [administration]
      security: [{ adminSessionCookie: [] }]
      description: 'Trial customers only (trial running, or ended without any paid or complimentary coverage): activates a paid plan over explicit coverage days (startsOn inclusive, endsOn exclusive, in the customer timezone, today means now) settled by a confirmed payment (price snapshot of the plan and cycle, current tax) or as complimentary access (no grace after it ends). The trial is never extended to bridge a gap before startsOn. Requires a reason and UI confirmation; no fresh second factor. 400 COVERAGE_INVALID, 400 PAYMENT_DETAILS_REQUIRED, 400 PAYMENT_DETAILS_UNEXPECTED, 400 INVALID_PAYMENT_METHOD, 400 INVALID_PLAN, 409 SUBSCRIPTION_NOT_STARTED, 409 SUBSCRIPTION_NOT_TRIAL, 409 SUBSCRIPTION_SUSPENDED, 409 PLAN_NOT_SELLABLE (pins the selling version). Audited subscription.activate.'
      parameters:
        - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPlanActivation' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOwnerDetail' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
components:
  schemas:
    AdminLogin:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 256 }
    AdminLoginChallenge:
      type: object
      additionalProperties: false
      required: [step, enrollment]
      properties:
        step: { type: string, enum: [enroll, verify] }
        enrollment:
          description: 'Present only for step enroll. Shown once; a new secret is issued on every unenrolled sign-in.'
          anyOf:
            - { $ref: '#/components/schemas/AdminTotpEnrollment' }
            - { type: 'null' }
    AdminTotpEnrollment:
      type: object
      additionalProperties: false
      required: [otpauthUri, secret]
      properties:
        otpauthUri:
          {
            type: string,
            description: 'otpauth://totp URI for QR rendering (SHA1, 6 digits, 30 s).',
          }
        secret: { type: string, description: Base32 secret for manual entry. }
    AdminTwoFactor:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    AdminSession:
      type: object
      additionalProperties: false
      required: [admin, expiresAt, idleTimeoutSeconds]
      properties:
        admin:
          type: object
          additionalProperties: false
          required: [id, email, name]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            name: { type: string }
        expiresAt: { type: string, format: date-time, description: Absolute session end. }
        idleTimeoutSeconds: { type: integer, minimum: 1 }
    AdminPayment:
      type: object
      additionalProperties: false
      required:
        [
          id,
          ownerId,
          ownerEmail,
          planCode,
          planVersionNumber,
          cycle,
          kind,
          status,
          method,
          reference,
          amount,
          coverageStart,
          coverageEnd,
          submittedAt,
          decidedAt,
          decidedBy,
          receivedReference,
          rejectionReason,
          quoteExpiresAt,
          receivedTtc,
          invoiceNumber,
        ]
      properties:
        quoteExpiresAt: { type: [string, 'null'], format: date-time }
        receivedTtc: { type: integer, minimum: 0 }
        invoiceNumber: { type: [string, 'null'] }
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        ownerEmail: { type: string }
        planCode: { $ref: ../../openapi.yaml#/components/schemas/PaidPlanCode }
        planVersionNumber: { type: integer, minimum: 1 }
        cycle: { $ref: ../../openapi.yaml#/components/schemas/BillingCycle }
        kind: { type: string, enum: [activation, renewal, upgrade] }
        status: { type: string, enum: [submitted, confirmed, rejected] }
        method: { type: string }
        reference: { type: string }
        amount: { $ref: ../../openapi.yaml#/components/schemas/MoneyBreakdown }
        coverageStart: { type: [string, 'null'], format: date-time }
        coverageEnd: { type: [string, 'null'], format: date-time }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        decidedBy: { type: [string, 'null'] }
        receivedReference: { type: [string, 'null'] }
        rejectionReason: { type: [string, 'null'] }
    AdminPaymentPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminPayment' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    AdminPaymentConfirmation:
      type: object
      additionalProperties: false
      required: [auditReason]
      properties:
        auditReason:
          {
            type: string,
            minLength: 1,
            maxLength: 500,
            description: 'Internal note kept only in the administrator audit trail; never shown to owners or staff.',
          }
        receivedReference:
          {
            type: string,
            minLength: 1,
            maxLength: 120,
            description: 'Bank or cash receipt reference actually observed; defaults to the owner''s reference. Unique per payment (idempotency key of the receipt).',
          }
        receivedAmountTtc:
          {
            type: integer,
            minimum: 1,
            description: 'Centimes actually received; defaults to the remaining balance. Must not exceed it.',
          }
        receivedAt:
          {
            type: string,
            format: date-time,
            description: 'When the funds were received; defaults to now. Decides whether the quote was still valid.',
          }
    AdminInvoice:
      type: object
      additionalProperties: false
      required: [ownerId, ownerEmail, invoice]
      properties:
        ownerId: { type: string, format: uuid }
        ownerEmail: { type: string }
        invoice: { $ref: ../../openapi.yaml#/components/schemas/BillingInvoice }
    AdminInvoicePage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminInvoice' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    AdminCreditNoteRequest:
      type: object
      additionalProperties: false
      required: [amountHt, reason, auditReason]
      properties:
        amountHt: { type: integer, minimum: 1, description: 'Centimes excluding tax; tax uses the invoice rate, rounded half-up.' }
        reason: { type: string, minLength: 1, maxLength: 500, description: Printed on the credit note and shown to the owner. }
        auditReason: { type: string, minLength: 1, maxLength: 500 }
    AdminPaymentRejection:
      type: object
      additionalProperties: false
      required: [reason, auditReason]
      properties:
        auditReason:
          {
            type: string,
            minLength: 1,
            maxLength: 500,
            description: 'Internal note kept only in the administrator audit trail; never shown to owners or staff.',
          }
        reason: { type: string, minLength: 1, maxLength: 500, description: Shown to the owner. }
    AdminOwnerSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          email,
          firstName,
          lastName,
          createdAt,
          disabledAt,
          subscriptionStatus,
          planCode,
          paidThroughAt,
          organizationCount,
          blockedAt,
          deletionDueAt,
          invitationPending,
          subscriptionError,
        ]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        disabledAt: { type: [string, 'null'], format: date-time }
        subscriptionStatus:
          {
            type: [string, 'null'],
            enum: [not_started, trial, active, past_due, expired, suspended, null],
            description: 'Null when access cannot be resolved for this owner; subscriptionError then says why.',
          }
        planCode:
          {
            type: [string, 'null'],
            enum: [trial, essential, business, pro, null],
            description: 'Null when access cannot be resolved (see subscriptionError).',
          }
        paidThroughAt: { type: [string, 'null'], format: date-time }
        subscriptionError:
          {
            type: [string, 'null'],
            enum: [SUBSCRIPTION_CATALOG_UNAVAILABLE, SUBSCRIPTION_PERIODS_INCONSISTENT, null],
            description: 'Per-row diagnostic; other owners in the page are unaffected.',
          }
        organizationCount: { type: integer, minimum: 0 }
        blockedAt: { type: [string, 'null'], format: date-time, description: Administrator block. }
        deletionDueAt:
          { type: [string, 'null'], format: date-time, description: Scheduled deletion date. }
        invitationPending: { type: boolean }
    AdminOwnerPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminOwnerSummary' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    AdminOwnerDetail:
      type: object
      additionalProperties: false
      required:
        [owner, organizations, subscription, subscriptionError, payments, restriction, invitationPending]
      properties:
        restriction: { $ref: '#/components/schemas/AdminOwnerRestriction' }
        invitationPending:
          { type: boolean, description: 'Created by an administrator and no password set yet.' }
        owner:
          type: object
          additionalProperties: false
          required: [id, email, firstName, lastName, locale, emailVerifiedAt, disabledAt, createdAt]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            firstName: { type: [string, 'null'] }
            lastName: { type: [string, 'null'] }
            locale: { type: string, enum: [fr, en] }
            emailVerifiedAt: { type: [string, 'null'], format: date-time }
            disabledAt: { type: [string, 'null'], format: date-time }
            createdAt: { type: string, format: date-time }
        organizations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, slug, createdAt, activatedAt, state, suspendedAt, suspensionReason]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              slug: { type: string }
              createdAt: { type: string, format: date-time }
              activatedAt: { type: [string, 'null'], format: date-time }
              state:
                {
                  type: string,
                  enum: [setup, active, paused, suspended, pending_deletion],
                  description: 'Own organization markers; customer block and subscription state apply on top.',
                }
              suspendedAt: { type: [string, 'null'], format: date-time }
              suspensionReason:
                { type: [string, 'null'], description: 'Internal administrator note.' }
        subscription:
          description: 'Null when access cannot be resolved; subscriptionError then says why. Payments and restrictions stay available for support.'
          anyOf:
            - { $ref: ../../openapi.yaml#/components/schemas/OwnerSubscription }
            - { type: 'null' }
        subscriptionError:
          {
            type: [string, 'null'],
            enum: [SUBSCRIPTION_CATALOG_UNAVAILABLE, SUBSCRIPTION_PERIODS_INCONSISTENT, null],
          }
        payments:
          type: array
          items: { $ref: '#/components/schemas/AdminPayment' }
    AdminReason:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          {
            type: string,
            minLength: 1,
            maxLength: 500,
            description: 'Internal note kept in the audit trail; never shown to owners or staff.',
          }
    AdminOrganizationSlugChange:
      type: object
      additionalProperties: false
      required: [slug, reason]
      properties:
        slug: { type: string, minLength: 1, maxLength: 100 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdminSensitiveAction:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdminEntitlementOverride:
      type: object
      additionalProperties: false
      description: 'Exactly one value representation: booleanValue for features, integerValue for finite limits, unlimited=true for permitted unlimited counts.'
      required:
        [
          id,
          entitlementKey,
          booleanValue,
          integerValue,
          unlimited,
          startsAt,
          endsAt,
          reason,
          createdBy,
          createdAt,
          revokedAt,
          revokedBy,
          revocationReason,
          replacesId,
          state,
          timezone,
        ]
      properties:
        id: { type: string, format: uuid }
        entitlementKey: { $ref: ../../openapi.yaml#/components/schemas/EntitlementKey }
        booleanValue: { type: [boolean, 'null'] }
        integerValue: { type: [integer, 'null'], minimum: 0 }
        unlimited: { type: boolean }
        startsAt: { type: string, format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        reason: { type: string }
        createdBy: { type: string, description: 'Administrator email.' }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        revokedBy: { type: [string, 'null'] }
        revocationReason: { type: [string, 'null'] }
        replacesId: { type: [string, 'null'], format: uuid }
        state: { type: string, enum: [scheduled, active, ended, revoked] }
        timezone:
          {
            type: string,
            description: 'Timezone used to interpret calendar days; instants above are UTC.',
          }
    AdminEntitlementOverrideList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminEntitlementOverride' } }
    AdminEntitlementOverrideCreate:
      type: object
      additionalProperties: false
      required: [entitlementKey, booleanValue, integerValue, unlimited, reason]
      properties:
        entitlementKey: { $ref: ../../openapi.yaml#/components/schemas/EntitlementKey }
        booleanValue: { type: [boolean, 'null'] }
        integerValue: { type: [integer, 'null'], minimum: 0, maximum: 9007199254740991 }
        unlimited: { type: boolean }
        startsOn:
          {
            type: [string, 'null'],
            format: date,
            description: 'Calendar day in the customer timezone; absent, null or today means now.',
          }
        endsOn:
          {
            type: [string, 'null'],
            format: date,
            description: 'Exclusive calendar day in the customer timezone; absent or null means until revoked.',
          }
        replacesId: { type: [string, 'null'], format: uuid }
        reason: { type: string, minLength: 1, maxLength: 500, pattern: '\S' }
    AdminOverrideRevocation:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, pattern: '\S' }
    AdminPlanChange:
      type: object
      additionalProperties: false
      required: [planCode, reason]
      properties:
        planCode: { $ref: ../../openapi.yaml#/components/schemas/PaidPlanCode }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdminCoverageExtension:
      type: object
      additionalProperties: false
      required: [days, reason]
      properties:
        days: { type: integer, minimum: 1, maximum: 366 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdminOwnerCreate:
      type: object
      additionalProperties: false
      required: [firstName, lastName, email, locale, subscription, reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        locale: { type: string, enum: [fr, en] }
        subscription:
          type: object
          additionalProperties: false
          required: [kind]
          description: 'trial: the 7-day trial starts with the first organization. paid: an administrator grant; requires planCode, cycle, coverageStart (not in the future) and coverageEnd (in the future).'
          properties:
            kind: { type: string, enum: [trial, paid] }
            planCode: { $ref: ../../openapi.yaml#/components/schemas/PaidPlanCode }
            cycle: { $ref: ../../openapi.yaml#/components/schemas/BillingCycle }
            coverageStart: { type: string, format: date-time }
            coverageEnd: { type: string, format: date-time }
    AdminOwnerRestriction:
      type: object
      additionalProperties: false
      required: [blockedAt, blockReason, deletionRequestedAt, deletionDueAt, deletionReason]
      properties:
        blockedAt: { type: [string, 'null'], format: date-time }
        blockReason: { type: [string, 'null'], description: Internal administrator note. }
        deletionRequestedAt: { type: [string, 'null'], format: date-time }
        deletionDueAt:
          {
            type: [string, 'null'],
            format: date-time,
            description: 'Cancellable until this date. Permanent purge is not automated yet.',
          }
        deletionReason: { type: [string, 'null'], description: Internal administrator note. }
    AdminBillingSettings:
      type: object
      additionalProperties: false
      required: [currency, taxRateBasisPoints, paymentMethods, paymentInstructions]
      properties:
        currency: { type: string, readOnly: true }
        taxRateBasisPoints: { type: [integer, 'null'], minimum: 0, maximum: 10000 }
        paymentMethods:
          type: array
          items: { type: string }
        paymentInstructions: { type: string }
    AdminBillingSettingsUpdate:
      type: object
      additionalProperties: false
      required: [taxRateBasisPoints, paymentMethods, paymentInstructions]
      properties:
        taxRateBasisPoints:
          {
            type: [integer, 'null'],
            minimum: 0,
            maximum: 10000,
            description: 'Null when tax is not legally applicable.',
          }
        paymentMethods:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 40, pattern: '^[a-z0-9_]+$' }
        paymentInstructions: { type: string, maxLength: 2000 }
    AdminAuditEntry:
      type: object
      additionalProperties: false
      required: [id, adminId, actor, action, targetType, targetId, before, after, createdAt]
      properties:
        id: { type: string, format: uuid }
        adminId: { type: [string, 'null'], format: uuid }
        actor: { type: string, description: 'Administrator email, or cli for operator tooling.' }
        action:
          {
            type: string,
            description: 'For example payment.confirm, payment.reject, billing_settings.update, customer.create, customer.invite, customer.block, customer.unblock, customer.delete, customer.delete_cancel, subscription.suspend, subscription.resume, subscription.activate, subscription.change_plan, subscription.extend, organization.suspend, organization.reactivate, organization.rename_slug, auth.login, auth.login_failed, admin.create, admin.disable, admin.reset_2fa, auth.passkey_login, auth.recovery_login, auth.reauthenticate, admin.passkey_add, admin.passkey_remove, admin.recovery_codes_regenerate, admin.totp_reset.',
          }
        targetType: { type: string }
        targetId: { type: [string, 'null'] }
        before: { type: [object, 'null'], additionalProperties: true }
        after: { type: [object, 'null'], additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AdminAuditPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminAuditEntry' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    AdminOverview:
      type: object
      additionalProperties: false
      required:
        [pendingPayments, activeSubscriptions, trialsEndingSoon, inGracePeriod, expired, suspended]
      properties:
        pendingPayments:
          description: 'Subscription payments with status submitted, awaiting confirmation or rejection.'
          type: integer
          minimum: 0
        activeSubscriptions:
          description: 'Owners with a confirmed coverage period containing the current instant (status active).'
          type: integer
          minimum: 0
        trialsEndingSoon:
          description: 'Owners still in trial (no confirmed coverage, trial not yet ended) whose trial ends within the next 7 days.'
          type: integer
          minimum: 0
        inGracePeriod:
          description: 'Owners with confirmed coverage but none current, still before the end of the 7-day grace (status past_due). Cancelled-at-period-end subscriptions have no grace and are never counted here.'
          type: integer
          minimum: 0
        expired:
          description: 'Owners whose access is blocked: trial ended without any coverage, or the grace period ended after the last coverage (status expired).'
          type: integer
          minimum: 0
        suspended:
          description: 'Subscriptions suspended by an administrator (status suspended); not counted in the other lifecycle counts.'
          type: integer
          minimum: 0
    AdminPasskeyChallenge:
      type: object
      additionalProperties: false
      required: [challengeId, optionsJSON]
      properties:
        challengeId: { type: string, format: uuid }
        optionsJSON:
          type: object
          additionalProperties: true
          description: 'WebAuthn options JSON produced by @simplewebauthn/server for @simplewebauthn/browser.'
    AdminPasskeyAssertion:
      type: object
      additionalProperties: false
      required: [challengeId, credential]
      properties:
        challengeId: { type: string, format: uuid }
        credential:
          type: object
          additionalProperties: true
          description: 'AuthenticationResponseJSON from @simplewebauthn/browser; verified server-side by the library.'
    AdminRecoveryCodeSubmission:
      type: object
      additionalProperties: false
      required: [recoveryCode]
      properties:
        recoveryCode: { type: string, minLength: 8, maxLength: 32, pattern: '^[A-Za-z0-9-]+$' }
    AdminReauthentication:
      type: object
      additionalProperties: false
      required: [method]
      description: 'passkey requires challengeId and credential; password_totp requires password and code (400 VALIDATION_ERROR otherwise).'
      properties:
        method: { type: string, enum: [passkey, password_totp] }
        challengeId: { type: string, format: uuid }
        credential: { type: object, additionalProperties: true }
        password: { type: string, minLength: 1, maxLength: 256 }
        code: { type: string, pattern: '^[0-9]{6}$' }
    AdminReauthenticationResult:
      type: object
      additionalProperties: false
      required: [reauthenticatedUntil]
      properties:
        reauthenticatedUntil: { type: string, format: date-time }
    AdminPasskey:
      type: object
      additionalProperties: false
      required: [id, name, createdAt, lastUsedAt, backedUp]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        backedUp: { type: boolean, description: 'Synced (multi-device) credential.' }
    AdminPasskeyRegistration:
      type: object
      additionalProperties: false
      required: [challengeId, name, credential]
      properties:
        challengeId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60, pattern: '\S' }
        credential:
          type: object
          additionalProperties: true
          description: 'RegistrationResponseJSON from @simplewebauthn/browser.'
    AdminSecurity:
      type: object
      additionalProperties: false
      required: [totpEnrolled, passkeys, recoveryCodesRemaining, reauthenticatedUntil]
      properties:
        totpEnrolled: { type: boolean }
        passkeys: { type: array, items: { $ref: '#/components/schemas/AdminPasskey' } }
        recoveryCodesRemaining: { type: integer, minimum: 0 }
        reauthenticatedUntil: { type: [string, 'null'], format: date-time }
    AdminRecoveryCodes:
      type: object
      additionalProperties: false
      required: [codes]
      properties:
        codes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string }
          description: 'Shown once; never retrievable again.'
    AdminPlanActivation:
      type: object
      additionalProperties: false
      required: [planCode, cycle, startsOn, endsOn, settlement, reason]
      description: 'confirmed_payment requires paymentMethod and receivedReference; complimentary forbids them.'
      properties:
        planCode: { $ref: ../../openapi.yaml#/components/schemas/PaidPlanCode }
        cycle: { $ref: ../../openapi.yaml#/components/schemas/BillingCycle }
        startsOn: { type: string, format: date, description: 'Inclusive; today or later, not before the trial start.' }
        endsOn: { type: string, format: date, description: 'Exclusive; after startsOn, at most 3 years later.' }
        settlement: { type: string, enum: [confirmed_payment, complimentary] }
        paymentMethod: { type: string, minLength: 1, maxLength: 40, pattern: '^[a-z0-9_]+$' }
        receivedReference: { type: string, minLength: 1, maxLength: 120 }
        reason: { type: string, minLength: 1, maxLength: 500, pattern: '\S' }
