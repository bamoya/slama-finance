{
  "paths": {
    "/v1/owner/organizations": {
      "post": {
        "operationId": "createOwnerOrganization",
        "security": [
          {
            "ownerSessionCookie": []
          }
        ],
        "responses": {
          "201": {
            "description": "Owner-scoped setup",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OwnerOnboarding"
                }
              }
            }
          },
          "default": {
            "description": "Authorization, validation or concurrency error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../../openapi.yaml#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateOwnerOrganization"
              }
            }
          }
        }
      }
    },
    "/v1/owner/organizations/{organizationId}/onboarding": {
      "parameters": [
        {
