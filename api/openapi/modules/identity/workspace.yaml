paths:
  /api/v1/workspace/session:
    get:
      operationId: getWorkspaceSession
      tags: [ identity ]
      security:
        [
          { organizationStaffCookie: [] }
        ]
      responses:
        '200':
          description: Verified organization workspace identity. Only independent organization sessions are accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSession' }
        default:
          description: Request failed
          content:
            application/json:
              schema: { $ref: ../../openapi.yaml#/components/schemas/Error }
components:
  schemas:
    WorkspaceSession:
      type: object
      additionalProperties: false
      required: [ organization, identityType, session, subscription, defaultVatRate ]
      properties:
        organization: { $ref: ./owner-organizations.yaml#/components/schemas/OwnerOrganization }
        identityType: { type: string, enum: [ staff ] }
        session: { $ref: ./auth.yaml#/components/schemas/Session }
        subscription:
          type: object
          additionalProperties: false
          required: [entitlements, accessValidUntil]
          properties:
            entitlements:
              $ref: ../subscriptions/subscriptions.yaml#/components/schemas/SubscriptionEntitlements
            accessValidUntil:
              type: [string, 'null']
              format: date-time
              description: Next instant at which resolved access may change; the client refetches then.
        defaultVatRate:
          type:
            - string
            - "null"
