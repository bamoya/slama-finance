paths:
  /api/v1/organization-auth/login:
    post:
      operationId: organizationStaffLogin
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Session
        default:
          description: Standard error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/Login
  /api/v1/organization-auth/session:
    get:
      operationId: organizationStaffSession
      security:
        - organizationStaffCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Session
        default:
          description: Standard error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Error
  /api/v1/organization-auth/logout:
    post:
      operationId: organizationStaffLogout
      security:
        - organizationStaffCookie: []
      responses:
        "204":
          description: Success
        default:
          description: Standard error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Error
  /api/v1/organization-auth/profile:
    patch:
      operationId: organizationStaffUpdateProfile
      security:
        - organizationStaffCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Session
        default:
          description: Standard error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/UpdateProfile
  /api/v1/organization-auth/change-password:
    post:
      operationId: organizationStaffChangePassword
      security:
        - organizationStaffCookie: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Session
        default:
          description: Standard error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/ChangePassword
  /api/v1/organization-auth/password-reset/request:
    post:
      operationId: organizationStaffRequestReset
      security: []
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/PasswordResetAccepted
        default:
          description: Standard error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/PasswordResetRequest
  /api/v1/organization-auth/password-reset/confirm:
    post:
      operationId: organizationStaffConfirmReset
      security: []
      responses:
        "204":
          description: Success
        default:
          description: Standard error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/PasswordResetConfirm
