paths:
  /v1/organizations/{organizationId}/auth/login:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: organizationStaffLogin
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Session
        default:
          description: Standard error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/Login
  /v1/organizations/{organizationId}/auth/session:
    parameters:
