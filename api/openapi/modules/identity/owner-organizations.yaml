paths:
  /v1/owner/organizations:
    post:
      $ref: ./owner-onboarding.yaml#/paths/~1v1~1owner~1organizations/post
    get:
      operationId: listOwnerOrganizations
      security:
        - ownerSessionCookie: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - setup
              - paused
              - suspended
              - pending_deletion
      responses:
        "200":
          description: Owned organizations only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerOrganizationList"
        default:
          description: Standard error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Error
  /v1/owner/organizations/{organizationId}:
    get:
      operationId: getOwnerOrganization
      security:
        - ownerSessionCookie: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Owned organization metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerOrganization"
        default:
          description: Standard error
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Error
components:
  schemas:
    OwnerOrganization:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - locale
        - status
        - createdAt
        - staffCount
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        locale:
          type: string
          enum:
            - fr
            - en
        status:
          type: string
          enum:
            - active
            - setup
            - paused
            - suspended
            - pending_deletion
        createdAt:
          type: string
          format: date-time
        staffCount:
          type: integer
          minimum: 0
    OwnerOrganizationList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OwnerOrganization"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
