paths:
  /v1/catalog/deletion/preview:
    post:
      operationId: previewCatalogDeletion
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogDeletionSelection' }
      responses:
        '200':
          description: Atomic deletion and document-reference detachment impact.
          content:
            application/json:
              schema: { $ref: '../../shared/impact.yaml#/components/schemas/EntityDeletionImpact' }
        default:
          description: Invalid or forbidden selection.
          content:
            application/json:
              schema: { $ref: '../../shared/errors.yaml#/components/schemas/Error' }
  /v1/catalog/deletion:
    post:
      operationId: confirmCatalogDeletion
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmCatalogDeletion' }
      responses:
        '204': { description: Whole selection deleted; historical sales snapshots preserved. }
        default:
          description: Nothing changed. Review a fresh preview.
          content:
            application/json:
              schema: { $ref: '../../shared/errors.yaml#/components/schemas/Error' }
components:
  schemas:
    CatalogDeletionSelection:
      type: object
      additionalProperties: false
      required: [resource, records]
      properties:
        resource: { type: string, enum: [products, categories] }
        cascadeProducts: { type: boolean, default: false }
        records:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '../../shared/impact.yaml#/components/schemas/DeletionRecord' }
    ConfirmCatalogDeletion:
      type: object
      additionalProperties: false
      required: [resource, records, token]
      properties:
        resource: { $ref: '#/components/schemas/CatalogDeletionSelection/properties/resource' }
        records: { $ref: '#/components/schemas/CatalogDeletionSelection/properties/records' }
        cascadeProducts: { type: boolean, default: false }
        token: { type: string, minLength: 1, maxLength: 256 }
