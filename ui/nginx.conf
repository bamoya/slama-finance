# Routing for every public host (apex, www., app., admin., <slug>., api.).
# The public ingress (Traefik/Coolify) terminates TLS and forwards every host here.
#
#   www.<domain>      -> 301 to the apex
#   api.<domain>      -> API only
#   any other host    -> /api/* to the API, everything else to the UI

# Docker's embedded DNS. A variable upstream lets nginx start before the API resolves.
resolver 127.0.0.11 valid=10s ipv6=off;

# Keep the scheme set by the public ingress; fall back to the local one.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}


server {
    listen 8080;
    server_name ~^www\.(?<apex>.+)$;
    server_tokens off;

    location / {
        return 301 $forwarded_proto://$apex$request_uri;
    }
}

# Not for browsers: documentation, health and future token-based integrations.
server {
    listen 8080;
    server_name ~^api\.;
    server_tokens off;

    location /api/ {
        include /etc/nginx/api-proxy.conf;
    }
    location / {
        return 404;
    }
}

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        include /etc/nginx/api-proxy.conf;
    }

    location = /config.js {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    # Hashed Vite assets are immutable. Missing assets must not return index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
