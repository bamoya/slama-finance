name: Check and publish images

# Checks run on pushes and pull requests. Master and slama release pushes publish images.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-publish-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.changes.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect image-relevant changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT" != push || -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" HEAD | python3 -c 'import sys; paths = sys.stdin.read().splitlines(); sys.exit(0 if any(not (p.startswith("docs/") or p.endswith(".md")) for p in paths) else 1)'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --dir api contracts:generate && pnpm --dir ui api:generate
      - run: pnpm lint

  ui-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ui typecheck
      - run: pnpm --dir ui test
      - run: pnpm --dir ui build

  api-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_DB: slama_finance_test
          POSTGRES_USER: slama_test
          POSTGRES_PASSWORD: slama_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slama_test -d slama_finance_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://slama_test:slama_test@127.0.0.1:5432/slama_finance_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir api typecheck
      - run: pnpm --dir api test
      - run: pnpm --dir api build
      - run: pnpm test:integration

  publish:
    needs: [changes, quality-check, ui-check, api-check]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/slama') &&
      needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: api/Dockerfile
            target: ''
          - component: ui
            dockerfile: ui/Dockerfile
            target: ''
          - component: release
            dockerfile: api/Dockerfile
            target: release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve image reference
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      # Authenticate public base-image pulls; application images publish to GHCR.
      - name: Authenticate Docker Hub pulls
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          # No mutable latest tag, runtime credentials, or deployment webhook.
          # UI API origin is configured at container startup using API_BASE_URL.
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}-multiarch
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-multiarch
      - name: Record immutable deployment reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### ${IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit tag: ${IMAGE}:${COMMIT}" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable digest (preferred for deployment): ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
