name: Publish production images

# Publishing is deliberately manual. This workflow does not deploy a server.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Keep this gate aligned with check.yml, which is not a reusable workflow.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: slama_finance_test
          POSTGRES_USER: slama_test
          POSTGRES_PASSWORD: slama_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slama_test -d slama_finance_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://slama_test:slama_test@127.0.0.1:5432/slama_finance_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:integration

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: api/Dockerfile
            target: ''
          - component: ui
            dockerfile: ui/Dockerfile
            target: ''
          - component: release
            dockerfile: api/Dockerfile
            target: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve image reference
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api-slama-finance.bamoya.com' }}
          platforms: linux/amd64,linux/arm64
          push: true
          # No mutable latest tag, runtime credentials, or deployment webhook.
          # UI requests use the public API origin baked into the Vite build.
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}-multiarch
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-multiarch
      - name: Record immutable deployment reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### ${IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit tag: ${IMAGE}:${COMMIT}" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable digest (preferred for deployment): ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
