services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://slama:slama@postgres:5432/slama_finance
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3000:3000"

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: slama_finance
      POSTGRES_USER: slama
      POSTGRES_PASSWORD: slama
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slama -d slama_finance"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"

volumes:
  postgres-data:
