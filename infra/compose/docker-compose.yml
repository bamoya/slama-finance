# Preserve existing local volume names after moving the file out of the root.
name: slama-finance

services:
  minio:
    build:
      context: ../../api/docker
      dockerfile: minio.Dockerfile
    environment:
      MINIO_ROOT_USER: slama-local
      MINIO_ROOT_PASSWORD: slama-local-development-only
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_DB: slama_finance_test
      POSTGRES_USER: slama_test
      POSTGRES_PASSWORD: slama_test
    ports:
      - '127.0.0.1:55439:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slama_test -d slama_finance_test']
      interval: 2s
      timeout: 2s
      retries: 20

  # api:
  #   build:
  #     context: ../..
  #     dockerfile: api/Dockerfile
  #   environment:
  #     PORT: 3000
  #     NODE_ENV: development
  #     DATABASE_URL: postgres://slama:slama@postgres:5432/slama_finance
  #     REDIS_URL: redis://redis:6379
