  #       condition: service_started
  #   ports:
  #     - '3000:3000'

  # ui:
  #   build:
  #     context: ../..
  #     dockerfile: ui/Dockerfile
  #   depends_on:
  #     - api
  #   ports:
  #     - '8080:80'

  postgres:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_DB: slama_finance
      POSTGRES_USER: slama
      POSTGRES_PASSWORD: slama
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slama -d slama_finance']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6380:6379'

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - '8025:8025'

volumes:
  minio-data:
  postgres-data:
