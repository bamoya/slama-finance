# Dokploy single-file stack for the 2-vCPU / 8-GB development host.
# WARNING: database password defaults are PUBLIC, insecure development placeholders.
# Override both passwords in Dokploy before deployment. Use URL-safe passwords.
# Changing env passwords after database initialization does NOT rotate database roles.
# Initialization runs before API startup. Admin bootstrap and real S3/Resend credentials remain required.
# From repository root, explicitly pass --env-file .env.production for CLI use.
# Dokploy Domains: slama-finance.bamoya.com -> ui:8080;
# api-slama-finance.bamoya.com -> api:3000. Enable HTTPS for both.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: slama_finance
      POSTGRES_USER: slama_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-CHANGE_ME_owner_dev_2026}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    shm_size: 256m
    mem_limit: 2g
    cpus: 0.65
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slama_owner -d slama_finance']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  api:
    image: ${API_IMAGE:-ghcr.io/bamoya/slama-finance-api@sha256:578dd8b75559661e1a5ea430eda7c60dca43c11aca698e84a3e5823bf48e61bb}
    restart: unless-stopped
    init: true
    expose: ['3000']
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      # A separately provisioned non-owner role, never slama_owner.
      DATABASE_URL: postgres://slama_runtime:${POSTGRES_RUNTIME_PASSWORD:-CHANGE_ME_runtime_dev_2026}@postgres:5432/slama_finance
      DATABASE_POOL_SIZE: '5'
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-https://slama-finance.bamoya.com}
      # Empty is fail-safe: forwarded addresses are ignored until proxy IPs are verified.
      TRUST_PROXY_IPS: ${TRUST_PROXY_IPS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set the Resend API key}
      EMAIL_FROM: ${EMAIL_FROM:?Set the verified sender email address}
      PASSWORD_RESET_URL: ${PUBLIC_ORIGIN:-https://slama-finance.bamoya.com}/reset-password
      NOTIFICATION_TRANSPORT: resend
      # PostgreSQL-backed workers run inside this single API process; no Redis needed.
      NOTIFICATION_WORKER_ENABLED: 'true'
      NOTIFICATION_POLL_MS: '2000'
      REPORT_POLL_MS: '10000'
      NOTIFICATION_PAYLOAD_RETENTION_DAYS: ${NOTIFICATION_PAYLOAD_RETENTION_DAYS:-0}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set the HTTPS S3 endpoint}
      S3_REGION: ${S3_REGION:?Set the storage region}
      S3_BUCKET: ${S3_BUCKET:?Set the private media bucket name}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set the dedicated media access key ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set the dedicated media secret access key}
      LOG_LEVEL: info
      NODE_OPTIONS: --max-old-space-size=1536
    networks: [application, database]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 3g
    cpus: 0.90
    stop_grace_period: 60s
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ready', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

  ui:
    image: ${UI_IMAGE:-ghcr.io/bamoya/slama-finance-ui@sha256:a903ccf9d7f9c2bda20b81e71804420980e58f3e03feddfa50eb17a91d30cd84}
    restart: unless-stopped
    expose: ['8080']
    networks: [default, application]
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.15
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/index.html']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

  # One-shot initialization. A failure blocks the API. No owner credentials in API.
  migrate:
    image: ${RELEASE_IMAGE:?Set the newly published release image containing initialize-database.mjs}
    command: ['node', 'scripts/initialize-database.mjs']
    restart: 'no'
    environment:
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-yassin.bassim11@gmail.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SEED_CATALOG: ${SEED_CATALOG:-false}
      MIGRATION_DATABASE_URL: postgres://slama_owner:${POSTGRES_OWNER_PASSWORD:-CHANGE_ME_owner_dev_2026}@postgres:5432/slama_finance
      DATABASE_URL: postgres://slama_runtime:${POSTGRES_RUNTIME_PASSWORD:-CHANGE_ME_runtime_dev_2026}@postgres:5432/slama_finance
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    cpus: 0.40
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

volumes:
  # Compose creates this named volume on first deployment and reuses it thereafter.
  # Keep its name stable. Never use down -v or delete this volume in Dokploy:
  # doing so permanently removes the database unless an independent backup exists.
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-slama-finance-dokploy-postgres}

networks:
  # Dokploy attaches its proxy network to each service selected in Domains.
  default: {}
  # No published ports. API keeps outbound access for object storage and Resend.
  application: {}
  database:
    internal: true
